# =============================================================
# nginx configuration for player-analysis frontend
#
# Responsibilities:
#   1. Serve the React SPA static files
#   2. Handle client-side routing (all unknown paths → index.html)
#   3. Reverse-proxy /api/* requests to the backend container
#      This eliminates the hardcoded "http://localhost:8080" in
#      playersApi.jsx — in production, the frontend just calls /api/*
# =============================================================

server {
    listen 80;
    server_name _;

    # Root directory where the React build output lives
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression — reduces JS/CSS payload by ~70%
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml;

    # Cache static assets aggressively (JS/CSS have content-hashed filenames)
    location ~* \.(js|css|png|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Reverse proxy: all /api/* requests go to the backend service
    # "backend" is the Docker Compose service name — Docker's internal
    # DNS resolves it automatically inside the docker network
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;

        # Required headers for proper proxying
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts — give the backend enough time for the ML pipeline
        # on first startup (K-Means + regression on 571 players)
        proxy_connect_timeout 60s;
        proxy_send_timeout    60s;
        proxy_read_timeout    120s;

        # Disable buffering for real-time responses
        proxy_buffering off;
    }

    # SPA fallback: any path that doesn't match a real file
    # is served index.html — React Router handles it client-side
    location / {
        try_files $uri $uri/ /index.html;

        # Don't cache index.html so the browser always gets the latest
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Hide nginx version from response headers (security hardening)
    server_tokens off;

    # Basic security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
